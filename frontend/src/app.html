<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/wails.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        const key = "ldbeditor-theme-preference";
        const darkMediaQuery = "(prefers-color-scheme: dark)";
        const isThemePreference = (value) =>
          value === "light" || value === "dark" || value === "system";

        try {
          const storedPreference = localStorage.getItem(key);
          const preference = isThemePreference(storedPreference)
            ? storedPreference
            : "system";
          const systemPrefersDark =
            window.matchMedia && window.matchMedia(darkMediaQuery).matches;
          const effectiveTheme =
            preference === "system"
              ? systemPrefersDark
                ? "dark"
                : "light"
              : preference;
          const root = document.documentElement;

          root.classList.toggle("dark", effectiveTheme === "dark");
          root.dataset.theme = effectiveTheme;
          root.dataset.themePreference = preference;
          root.style.colorScheme = effectiveTheme;
        } catch {
          // Ignore storage/matchMedia errors.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
