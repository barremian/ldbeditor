name: Build and Package Desktop Artifacts

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

concurrency:
  group: build-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact name suffix
        id: artifact_suffix
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=v${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            branch=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "suffix=${branch}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisPath) {
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            throw "NSIS install directory not found at: $nsisPath"
          }

      - name: Install Wails v3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and package (Windows)
        shell: pwsh
        run: |
          where.exe makensis
          wails3 task windows:package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.artifact_suffix.outputs.suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/*.exe
            bin/*.msix
            build/windows/nsis/*.exe

  package-macos:
    name: Package macOS
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - darwin/amd64
          - darwin/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo "${{ matrix.platform }}" | sed -e 's/\//_/g' -e 's/darwin/mac/g' -e 's/amd64/intel/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=$(echo "${GITHUB_REF_NAME}" | sed -e 's/^v//g')
          else
            version=$(echo "${GITHUB_REF_NAME}" | sed -e 's/\//-/g')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build artifact label
        id: artifact_label
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            label="v${{ steps.normalise_version.outputs.version }}"
          else
            branch=$(echo "${GITHUB_REF_NAME}" | sed -e 's/\//-/g')
            label="${branch}-${GITHUB_SHA::7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build and package app (macOS)
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          arch="${platform##*/}"
          wails3 task darwin:package ARCH="$arch"

      - name: Archive macOS app bundle
        shell: bash
        run: |
          mkdir -p dist
          tar -C bin -czf "dist/ldbeditor-${{ steps.artifact_label.outputs.label }}-${{ steps.normalise_platform.outputs.tag }}.app.tar.gz" ldbeditor.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.normalise_platform.outputs.tag }}-${{ steps.artifact_label.outputs.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.tar.gz

  package-linux:
    name: Package Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build artifact name suffix
        id: artifact_suffix
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "suffix=v${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            branch=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "suffix=${branch}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libfuse2 \
            rpm

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build and package (Linux)
        shell: bash
        run: wails3 task linux:package

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.artifact_suffix.outputs.suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.*
